name: CI - Testes e Build

on:
  push:
    branches: [ main, develop, fix/adult-pcr-antiarrhythmics, fix/distribution-assets-pwa, fix/pcr-mobile-interface-6a ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: 🧪 Testes
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📚 Instalar dependências
        run: npm ci

      - name: 🧪 Executar testes
        run: npm run test:run

      - name: 📊 Gerar relatório de cobertura
        run: npm run test:coverage

      - name: 🔎 Verificar relatório de cobertura
        run: test -s coverage/coverage-final.json

      - name: 📤 Upload artefato de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: siav-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 7

  build:
    name: 🏗️ Build de Produção
    runs-on: ubuntu-latest
    needs: test
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📚 Instalar dependências
        run: npm ci

      - name: 🏗️ Build com configuração sintética (não publicar)
        run: npm run build
        env:
          VITE_SUPABASE_PROJECT_REF: lfcvjrshlybmurnvulvh
          VITE_SUPABASE_URL: https://lfcvjrshlybmurnvulvh.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_SYNTHETIC_CI_ONLY

      - name: 📤 Upload artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: dist-ci-synthetic
          path: dist/
          if-no-files-found: error
          retention-days: 7

  lint:
    name: 🔍 Linting e Qualidade
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🔍 Verificar sintaxe JavaScript
        run: |
          find src -name "*.js" -type f -print0 | xargs -0 -n 1 node --check
          echo "✅ Sintaxe JavaScript válida"

      - name: 📏 Verificar tamanho dos arquivos
        run: |
          echo "📊 Tamanho dos arquivos principais:"
          ls -lh script.js style.css index.html
          echo "✅ Verificação de tamanho concluída"
